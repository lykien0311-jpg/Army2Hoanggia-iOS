name: Build 276 game UI and aura
on:
  push:
    branches: [qa/ios-276-game-ui]
permissions:
  contents: read
concurrency:
  group: game-ui-276
  cancel-in-progress: true
jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash native-wheel/build_framework.sh
      - uses: actions/upload-artifact@v4
        id: artifact
        continue-on-error: true
        with:
          name: Army2Hoanggia-B276-framework
          path: |
            native-wheel/build/AGWheel-framework.zip
            native-wheel/build/build-info.json
            native-wheel/build/viewer-result.txt
            native-wheel/build/ui-check.json
          retention-days: 7
      - name: Retain private build if artifact quota is unavailable
        if: steps.artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 native-wheel/retain_build.py B276_FRAMEWORK native-wheel/build/AGWheel-framework.zip
  visual:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node native-wheel/test_lobby.js
      - uses: actions/upload-artifact@v4
        id: visual_artifact
        continue-on-error: true
        if: always()
        with:
          name: Army2Hoanggia-B276-UI-check
          path: native-wheel/build/lobby-*.png
          retention-days: 7
      - name: Retain private UI screenshots
        if: steps.visual_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 native-wheel/retain_build.py B276_VISUAL "$RUNNER_TEMP/visual.zip" 'native-wheel/build/lobby-*.png'
