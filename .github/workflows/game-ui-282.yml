name: Build Army2 iOS 282
on:
  push:
    branches: [qa/ios-282-inventory-market]
permissions:
  contents: read
concurrency:
  group: game-ui-282
  cancel-in-progress: true
jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify iPhone framework
        run: bash native-wheel/build_282.sh
      - name: Execute compiled inventory bridge
        run: |
          python3 -m venv native-wheel/build/inventory-qa
          native-wheel/build/inventory-qa/bin/pip install --quiet lief unicorn
          native-wheel/build/inventory-qa/bin/python native-wheel/test_inventory_device282.py native-wheel/build/QA/AGWheel.framework/AGWheel
      - name: Check native iOS input dialog
        run: bash native-wheel/test_input282.sh
      - name: Retain verified framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 native-wheel/retain_build.py B282_FRAMEWORK native-wheel/build/framework-282.zip
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node native-wheel/test_lobby.js
      - name: Retain interface checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 native-wheel/retain_build.py B282_UI native-wheel/build/ui-282.zip native-wheel/build/lobby-market.png native-wheel/build/market-price-282.png native-wheel/build/market-password-282.png
