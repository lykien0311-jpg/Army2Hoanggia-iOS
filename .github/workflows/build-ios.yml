name: Build Army2Hoanggia IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, qa/ios-275-boss-maps]
permissions:
  contents: read
concurrency:
  group: army-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-framework:
    if: github.ref_name == 'qa/ios-275-boss-maps' || github.head_ref == 'qa/ios-275-boss-maps'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash native-wheel/build_framework.sh
      - name: Verify the map hooks against the private baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-input-269 --repo "$GITHUB_REPOSITORY" --pattern Army2HoangGiaTF.ipa --dir "$RUNNER_TEMP"
          PYTHONPATH=native-wheel python3 - "$RUNNER_TEMP/Army2HoangGiaTF.ipa" <<'PY' > native-wheel/build/boss-native-sha.txt
          from hashlib import sha256
          from sys import argv
          from zipfile import ZipFile
          from patch_menu_269 import patch_menu
          from patch_boss_maps import patch_boss_maps
          with ZipFile(argv[1]) as baseline:
              native = baseline.read("Payload/Army2Hoanggia.app/Army2Hoanggia")
          print(sha256(patch_boss_maps(patch_menu(native))).hexdigest())
          PY
          cat native-wheel/build/boss-native-sha.txt
      - uses: actions/upload-artifact@v4
        id: framework_artifact
        continue-on-error: true
        with:
          name: Army2Hoanggia-QA-native-framework
          path: |
            native-wheel/build/AGWheel-framework.zip
            native-wheel/build/build-info.json
            native-wheel/build/ui-check.json
            native-wheel/build/captcha-ui-check.json
            native-wheel/build/viewer-result.txt
            native-wheel/build/boss-native-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain QA framework if Actions artifact storage is unavailable
        if: steps.framework_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          cd native-wheel/build
          zip -q -j "$RUNNER_TEMP/qa-framework-result.zip" AGWheel-framework.zip build-info.json ui-check.json captcha-ui-check.json viewer-result.txt boss-native-sha.txt
          python3 - "$RUNNER_TEMP/qa-framework-result.zip" > "$RUNNER_TEMP/qa-framework-blob.json" <<'PY'
          import base64, json, sys
          from pathlib import Path
          content = base64.b64encode(Path(sys.argv[1]).read_bytes()).decode('ascii')
          print(json.dumps({'encoding': 'utf-8', 'content': content}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/qa-framework-blob.json" --jq '"QA_FRAMEWORK_BLOB=" + .sha'
          shasum -a 256 "$RUNNER_TEMP/qa-framework-result.zip"
  compatibility:
    if: github.ref_name != 'qa/ios-275-boss-maps' && github.head_ref != 'qa/ios-275-boss-maps'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/prepare.py
      - run: bash j2me_api/build.sh
        working-directory: project-src
      - run: python3 tools/audit_client.py J2MEEmulator/Resources/jars/army2hoanggia.jar --report build/linkage.json
        working-directory: project-src
      - run: python3 tools/run_runtime_probe.py
        working-directory: project-src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-logs
          path: |
            project-src/build/linkage.json
            project-src/build/probe/*.log
          retention-days: 7
  ipa:
    needs: compatibility
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/prepare.py --with-font
      - run: bash tools/build_ios.sh
        working-directory: project-src
      - uses: actions/upload-artifact@v4
        with:
          name: Army2Hoanggia-unsigned-IPA
          path: project-src/build/Army2Hoanggia-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-build-log
          path: project-src/build/xcodebuild.log
          retention-days: 7
