name: Build Army2Hoanggia IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: army-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/prepare.py
      - run: bash j2me_api/build.sh
        working-directory: project-src
      - run: python3 tools/audit_client.py J2MEEmulator/Resources/jars/army2hoanggia.jar --report build/linkage.json
        working-directory: project-src
      - run: python3 tools/run_runtime_probe.py
        working-directory: project-src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-logs
          path: |
            project-src/build/linkage.json
            project-src/build/probe/*.log
          retention-days: 7
  ipa:
    needs: compatibility
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/prepare.py --with-font
      - run: bash tools/build_ios.sh
        working-directory: project-src
      - uses: actions/upload-artifact@v4
        with:
          name: Army2Hoanggia-unsigned-IPA
          path: project-src/build/Army2Hoanggia-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-build-log
          path: project-src/build/xcodebuild.log
          retention-days: 7
